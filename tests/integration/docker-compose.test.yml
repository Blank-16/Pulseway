services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseway
      POSTGRES_PASSWORD: pulseway
      POSTGRES_DB: pulseway_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseway"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
