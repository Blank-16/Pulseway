groups:
  - name: pulseway.worker
    interval: 30s
    rules:
      - alert: WorkerCheckFailureSpike
        expr: |
          rate(pulseway_worker_checks_failed_total{stale="false"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Worker check failure rate elevated"
          description: "Check failure rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: WorkerStaleMetrics
        expr: |
          count(pulseway_worker_checks_processed_total{stale="true"}) > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Worker metrics are stale — worker may be down"
          description: "No worker metric update received in the last 2 minutes."

      - alert: DQLQueueDepthHigh
        expr: |
          aws_sqs_approximate_number_of_messages_visible{queue_name=~".*dlq.*"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Messages in Dead Letter Queue"
          description: "{{ $value }} messages in DLQ — check worker logs immediately."

  - name: pulseway.api
    interval: 30s
    rules:
      - alert: APIHighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate > 5%"

      - alert: APIHighP99Latency
        expr: |
          histogram_quantile(0.99, rate(http_response_time_ms_bucket[5m])) > 2000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API p99 latency > 2s"
          description: "p99 is {{ $value }}ms."

      - alert: APIHealthCheckFailing
        expr: |
          probe_success{job="pulseway-api-ready"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API readiness probe failing"

  - name: pulseway.scheduler
    interval: 60s
    rules:
      - alert: SchedulerLockNotRefreshed
        expr: |
          time() - pulseway_scheduler_last_tick_timestamp > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scheduler has not ticked in > 60s"
          description: "Scheduler lock may be stuck or process is down."

  - name: pulseway.db
    interval: 60s
    rules:
      - alert: PostgresConnectionPoolExhausted
        expr: |
          pg_stat_activity_count{state="active"} / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection pool > 80% utilized"
